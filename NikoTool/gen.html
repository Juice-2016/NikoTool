<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成器合集 · NikoTool Lite</title>
<style>
:root{
  --text:#1e293b;--text-dim:#64748b;
  --accent:#2563eb;--accent-hover:#1d4ed8;--accent-soft:#eff6ff;
  --code-bg:#f8fafc;--dark:#1e293b;--border:#e2e8f0;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;padding:24px 20px;
  background:#fff;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 12% 8%,rgba(96,165,250,.18) 0%,transparent 42%),
    radial-gradient(circle at 88% 22%,rgba(147,197,253,.14) 0%,transparent 45%),
    radial-gradient(circle at 50% 100%,rgba(191,219,254,.16) 0%,transparent 50%);
}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:2}
nav{
  display:flex;align-items:center;gap:20px;
  padding:14px 22px;border-radius:14px;margin-bottom:32px;
  background:rgba(30,41,59,.85);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 32px rgba(30,64,175,.15);
}
nav .brand{font-weight:700;font-size:15px;font-family:Georgia,"Songti SC",serif;color:#fff}
nav .brand em{font-style:normal;color:#60a5fa}
nav a{margin-left:auto;color:#cbd5e1;text-decoration:none;font-size:13.5px}
nav a:hover{color:#60a5fa}
h1{margin:0 0 6px;font-size:26px;font-weight:700;letter-spacing:-.3px;font-family:Georgia,"Songti SC",serif}
h1 span{color:var(--accent)}
h1 + .en{font-size:11.5px;color:#94a3b8;font-style:italic;margin:0 0 10px;letter-spacing:.2px}
p.d{margin:0 0 24px;font-size:14px;color:var(--text-dim)}

.tabs{
  display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;
  padding:6px;border-radius:12px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(14px) saturate(180%);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  border:1px solid var(--border);
}
.tab{
  flex:1;min-width:120px;
  background:transparent;color:var(--text-dim);border:0;
  padding:10px 14px;border-radius:8px;
  font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:.15s;text-align:center;
}
.tab em{display:block;font-style:italic;font-size:11px;color:#94a3b8;margin-top:2px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.7)}
.tab.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.25)}
.tab.on em{color:rgba(255,255,255,.75)}
.panel{display:none}
.panel.on{display:block}

.card{
  border-radius:12px;background:rgba(255,255,255,.65);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border:1px solid rgba(226,232,240,.9);
  box-shadow:0 8px 28px rgba(30,64,175,.07), inset 0 1px 0 rgba(255,255,255,.9);
  padding:20px;margin-bottom:16px;
}
.card h3{margin:0 0 14px;font-size:14px;font-weight:600}
.field{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:10px}
.field label{color:var(--text-dim);font-size:13.5px}
.field input,.field textarea,.field select{
  background:#fff;color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px;outline:none;width:100%;
}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{
  background:var(--accent);color:#fff;border:0;border-radius:8px;
  padding:9px 16px;font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:.15s;
}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.preview{
  border:1px solid var(--border);border-radius:8px;background:#fff;
  overflow:hidden;margin-top:14px;
}
.preview iframe{width:100%;height:320px;border:0;background:#fff;display:block}
.code{
  background:var(--code-bg);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-all;
  max-height:240px;overflow:auto;margin-top:12px;line-height:1.7;
}
footer{color:var(--text-dim);font-size:12.5px;text-align:center;padding:24px 0 8px}
footer em{font-style:italic;color:#94a3b8}
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);
  background:var(--dark);color:#fff;border-radius:8px;
  padding:10px 18px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;
  box-shadow:0 4px 16px rgba(30,41,59,.2);z-index:99;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <span class="brand">NikoTool <em>Lite</em></span>
  <a href="index.html">← 返回主页 · Back</a>
</nav>

<h1>生成器<span>合集</span></h1>
<div class="en">Generator Pack · homepage, README, color scheme</div>
<p class="d">填写信息，实时预览，下载为 HTML 文件。所有生成都在浏览器本地完成。</p>

<div class="tabs">
  <button class="tab on" data-tab="home">个人主页<em>Homepage</em></button>
  <button class="tab" data-tab="readme">README</button>
  <button class="tab" data-tab="color">配色方案<em>Colors</em></button>
</div>

<section class="panel on" id="p-home">
  <div class="card">
    <h3>基本信息</h3>
    <div class="field"><label>名字</label><input id="h-name" value=""></div>
    <div class="field"><label>一句话签名</label><input id="h-tag" value="在浏览器里搭一个小宇宙"></div>
    <div class="field"><label>简介</label><textarea id="h-bio">喜欢前端，喜欢干净的界面，做点小工具自娱自乐。</textarea></div>
    <div class="field"><label>链接</label><input id="h-links" value="GitHub|https://github.com,主页|index.html"></div>
    <div class="field"><label>主色</label><input id="h-color" type="color" value="#2563eb" style="height:38px;padding:2px"></div>
  </div>
  <div class="row">
    <button class="btn" id="h-gen">生成预览</button>
    <button class="btn ghost" id="h-down">下载 HTML</button>
    <button class="btn ghost" id="h-copy">复制代码</button>
  </div>
  <div class="preview"><iframe id="h-frame"></iframe></div>
  <div class="code" id="h-code">点击「生成预览」查看代码</div>
</section>

<section class="panel" id="p-readme">
  <div class="card">
    <h3>项目信息</h3>
    <div class="field"><label>项目名</label><input id="r-name" value="NikoTool Lite"></div>
    <div class="field"><label>一句话介绍</label><input id="r-desc" value="纯前端的浏览器工具集"></div>
    <div class="field"><label>功能点</label><textarea id="r-feat" rows="4">JS 在线运行
JSON 解析与查询
HTML / CSS / JS 预览
哈希值生成器</textarea></div>
  </div>
  <div class="row">
    <button class="btn" id="r-gen">生成 Markdown</button>
    <button class="btn ghost" id="r-down">下载 README.md</button>
    <button class="btn ghost" id="r-copy">复制</button>
  </div>
  <div class="code" id="r-code">点击「生成 Markdown」查看结果</div>
</section>

<section class="panel" id="p-color">
  <div class="card">
    <h3>主题色</h3>
    <div class="field"><label>主色</label><input id="c-a" type="color" value="#2563eb" style="height:38px;padding:2px"></div>
    <div class="field"><label>强调色</label><input id="c-b" type="color" value="#0891b2" style="height:38px;padding:2px"></div>
    <div class="field"><label>背景色</label><input id="c-c" type="color" value="#f8fafc" style="height:38px;padding:2px"></div>
  </div>
  <div class="row">
    <button class="btn" id="c-gen">生成配色</button>
    <button class="btn ghost" id="c-copy">复制 CSS 变量</button>
  </div>
  <div class="preview"><iframe id="c-frame"></iframe></div>
  <div class="code" id="c-code">点击「生成配色」查看 CSS</div>
</section>

<footer>
  NikoTool Lite · 纯前端 · 本地运行
  <em> · no upload</em>
</footer>
</div>

<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let tt = null;
function toast(m){
  const e = $('toast'); e.textContent = m; e.classList.add('on');
  clearTimeout(tt); tt = setTimeout(()=>e.classList.remove('on'),1600);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}
function download(name, content){
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    $('p-' + t.dataset.tab).classList.add('on');
  };
});

function genHome(){
  const name  = $('h-name').value.trim() || '无名氏';
  const tag   = $('h-tag').value.trim();
  const bio   = $('h-bio').value.trim();
  const color = $('h-color').value;
  const links = $('h-links').value.split(',').map(s => s.trim()).filter(Boolean)
    .map(s => { const [t,u] = s.split('|').map(x=>x.trim()); return {t: t||'链接', u: u||'#'}; });
  const linkHTML = links.map(l =>
    `      <a class="btn" href="${esc(l.u)}">${esc(l.t)}</a>`).join('\n');
  const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(name)}</title>
<style>
body{margin:0;min-height:100vh;background:#f8fafc;color:#1e293b;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:32px 20px;
  font-size:15px;line-height:1.7}
.box{max-width:600px;width:100%}
h1{margin:0 0 8px;font-size:38px;font-weight:700;color:${color};
  letter-spacing:-.5px;font-family:Georgia,"Songti SC",serif}
.tag{color:#64748b;font-size:14px;margin-bottom:22px;font-style:italic}
.bio{font-size:15px;color:#334155;margin-bottom:28px;white-space:pre-wrap}
.btn{display:inline-block;margin:0 8px 8px 0;padding:10px 18px;
  background:${color};color:#fff;border-radius:8px;text-decoration:none;
  font-size:14px;font-weight:500;transition:.15s}
.btn:hover{filter:brightness(.92)}
footer{margin-top:36px;font-size:12px;color:#94a3b8;font-style:italic}
</style>
</head>
<body>
<div class="box">
  <h1>${esc(name)}</h1>
  <div class="tag">${esc(tag)}</div>
  <div class="bio">${esc(bio)}</div>
  <div>
${linkHTML}
  </div>
  <footer>Generated by NikoTool Lite</footer>
</div>
</body>
</html>`;
  $('h-frame').srcdoc = html;
  $('h-code').textContent = html;
  return html;
}
$('h-gen').onclick  = genHome;
$('h-down').onclick = () => { download('homepage.html', genHome()); toast('已下载'); };
$('h-copy').onclick = async () => {
  const ok = await copy(genHome());
  toast(ok ? '代码已复制' : '复制失败');
};

function genReadme(){
  const name = $('r-name').value.trim() || '未命名项目';
  const desc = $('r-desc').value.trim();
  const feats = $('r-feat').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const md = `# ${name}

${desc}

## 功能 Features

${feats.map(f => '- ' + f).join('\n')}

## 使用 Usage

直接打开 \`index.html\`，或部署到任意静态托管服务。
Open \`index.html\` directly, or deploy to any static host.

## 隐私 Privacy

所有计算均在浏览器本地完成，不上传任何数据。
All computation happens locally in your browser.

## License

MIT
`;
  $('r-code').textContent = md;
  return md;
}
$('r-gen').onclick  = genReadme;
$('r-down').onclick = () => { download('README.md', genReadme()); toast('已下载'); };
$('r-copy').onclick = async () => {
  const ok = await copy(genReadme());
  toast(ok ? 'Markdown 已复制' : '复制失败');
};

function genColor(){
  const a = $('c-a').value, b = $('c-b').value, c = $('c-c').value;
  const css = `:root{
  --primary: ${a};
  --accent: ${b};
  --bg: ${c};
  --card: #ffffff;
  --text: #1e293b;
  --text-dim: #64748b;
  --border: #e2e8f0;
}`;
  const preview = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{margin:0;padding:24px;background:${c};color:${a};
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h2{color:#1e293b;margin:0 0 16px;font-size:18px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sw{padding:28px 10px;border-radius:10px;text-align:center;font-size:12px;font-weight:600}
.a{background:${a};color:#fff}
.b{background:${b};color:#fff}
.c{background:${c};color:#1e293b;border:1px solid #e2e8f0}
.demo{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-top:12px}
button{background:${a};color:#fff;border:0;border-radius:8px;
  padding:9px 18px;font-family:inherit;font-size:13.5px;font-weight:500;
  cursor:pointer;margin-right:8px}
button.g{background:transparent;color:${a};border:1px solid ${a}}
</style></head><body>
<h2>配色预览 · Preview</h2>
<div class="swatches">
  <div class="sw a">主色 Primary</div>
  <div class="sw b">强调 Accent</div>
  <div class="sw c">背景 BG</div>
</div>
<div class="demo">
  <p style="margin:0 0 14px;color:#334155">示例文字，检查对比度是否舒适。</p>
  <button>Primary</button><button class="g">Ghost</button>
</div>
</body></html>`;
  $('c-frame').srcdoc = preview;
  $('c-code').textContent = css;
  return css;
}
$('c-gen').onclick  = genColor;
$('c-copy').onclick = async () => {
  const ok = await copy(genColor());
  toast(ok ? 'CSS 变量已复制' : '复制失败');
};

genHome();
genColor();
</script>
</body>
</html>
